services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - laravel-net

  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: always
    environment:
      MYSQL_DATABASE: laravel_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - laravel-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: laravel-pma
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: db
    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge